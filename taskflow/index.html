<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow | Smart Task Manager</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg: #0f172a;
            --bg-card: #1e293b;
            --bg-hover: #334155;
            --text: #f1f5f9;
            --text-muted: #94a3b8;
            --accent: #c75b3a;
            --accent-green: #22c55e;
            --border: rgba(255,255,255,0.08);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 20px;
        }
        .app {
            width: 100%;
            max-width: 600px;
        }
        .app-header {
            text-align: center;
            margin-bottom: 32px;
        }
        .app-header h1 {
            font-size: 2rem;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }
        .app-header h1 i { color: var(--accent); }
        .app-header p { color: var(--text-muted); font-size: 0.95rem; }
        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 24px;
        }
        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
        }
        .stat-card .num {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent);
        }
        .stat-card .label {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 4px;
        }
        .input-group {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }
        .input-group input {
            flex: 1;
            padding: 14px 18px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }
        .input-group input:focus { border-color: var(--accent); }
        .input-group input::placeholder { color: var(--text-muted); }
        .input-group button {
            padding: 14px 24px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .input-group button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(199,91,58,0.3);
        }
        .filters {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }
        .filter-btn {
            padding: 8px 16px;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-muted);
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s;
        }
        .filter-btn.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }
        .filter-btn:hover:not(.active) {
            border-color: var(--text-muted);
            color: var(--text);
        }
        .task-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .task-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 16px 18px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            transition: all 0.3s;
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .task-item:hover {
            border-color: rgba(255,255,255,0.15);
        }
        .task-item.completed .task-text {
            text-decoration: line-through;
            color: var(--text-muted);
        }
        .task-checkbox {
            width: 22px;
            height: 22px;
            border: 2px solid var(--text-muted);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            flex-shrink: 0;
        }
        .task-checkbox:hover { border-color: var(--accent); }
        .task-item.completed .task-checkbox {
            background: var(--accent-green);
            border-color: var(--accent-green);
        }
        .task-checkbox i {
            font-size: 0.7rem;
            color: white;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .task-item.completed .task-checkbox i { opacity: 1; }
        .task-text {
            flex: 1;
            font-size: 0.95rem;
        }
        .task-date {
            font-size: 0.75rem;
            color: var(--text-muted);
        }
        .task-delete {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }
        .task-delete:hover {
            background: rgba(239,68,68,0.1);
            color: #ef4444;
        }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }
        .empty-state i {
            font-size: 3rem;
            margin-bottom: 16px;
            opacity: 0.5;
        }
        .empty-state p { font-size: 0.95rem; }
        .footer {
            text-align: center;
            margin-top: 40px;
            color: var(--text-muted);
            font-size: 0.8rem;
        }
        @media (max-width: 480px) {
            .stats { grid-template-columns: 1fr; }
            .input-group { flex-direction: column; }
            .input-group button { width: 100%; }
        }
    </style>
<base target="_blank">
</head>
<body>
    <div class="app">
        <div class="app-header">
            <h1><i class="fas fa-check-double"></i> TaskFlow</h1>
            <p>Stay organized. Get things done.</p>
        </div>

        <div class="stats">
            <div class="stat-card">
                <div class="num" id="statTotal">0</div>
                <div class="label">Total</div>
            </div>
            <div class="stat-card">
                <div class="num" id="statActive">0</div>
                <div class="label">Active</div>
            </div>
            <div class="stat-card">
                <div class="num" id="statDone">0</div>
                <div class="label">Done</div>
            </div>
        </div>

        <div class="input-group">
            <input type="text" id="taskInput" placeholder="What needs to be done?" autocomplete="off">
            <button onclick="addTask()"><i class="fas fa-plus"></i> Add</button>
        </div>

        <div class="filters">
            <button class="filter-btn active" onclick="setFilter('all')">All</button>
            <button class="filter-btn" onclick="setFilter('active')">Active</button>
            <button class="filter-btn" onclick="setFilter('completed')">Completed</button>
        </div>

        <div class="task-list" id="taskList">
            <div class="empty-state">
                <i class="fas fa-clipboard-list"></i>
                <p>No tasks yet. Add one above to get started!</p>
            </div>
        </div>

        <div class="footer">
            <p>Tasks saved locally • Built by Anthony Reyes</p>
        </div>
    </div>

    <script>
        // Task Manager Logic
        let tasks = JSON.parse(localStorage.getItem('taskflow_tasks')) || [];
        let currentFilter = 'all';

        function saveTasks() {
            localStorage.setItem('taskflow_tasks', JSON.stringify(tasks));
        }

        function renderTasks() {
            const list = document.getElementById('taskList');
            const filtered = tasks.filter(t => {
                if (currentFilter === 'active') return !t.completed;
                if (currentFilter === 'completed') return t.completed;
                return true;
            });

            if (filtered.length === 0) {
                list.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-clipboard-list"></i>
                        <p>${currentFilter === 'all' ? 'No tasks yet. Add one above!' : 'No ' + currentFilter + ' tasks.'}</p>
                    </div>`;
            } else {
                list.innerHTML = filtered.map(task => `
                    <div class="task-item ${task.completed ? 'completed' : ''}">
                        <div class="task-checkbox" onclick="toggleTask(${task.id})">
                            <i class="fas fa-check"></i>
                        </div>
                        <span class="task-text">${escapeHtml(task.text)}</span>
                        <span class="task-date">${formatDate(task.created)}</span>
                        <button class="task-delete" onclick="deleteTask(${task.id})">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                `).join('');
            }

            updateStats();
        }

        function addTask() {
            const input = document.getElementById('taskInput');
            const text = input.value.trim();
            if (!text) return;

            tasks.unshift({
                id: Date.now(),
                text: text,
                completed: false,
                created: new Date().toISOString()
            });

            input.value = '';
            saveTasks();
            renderTasks();
        }

        function toggleTask(id) {
            const task = tasks.find(t => t.id === id);
            if (task) {
                task.completed = !task.completed;
                saveTasks();
                renderTasks();
            }
        }

        function deleteTask(id) {
            tasks = tasks.filter(t => t.id !== id);
            saveTasks();
            renderTasks();
        }

        function setFilter(filter) {
            currentFilter = filter;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderTasks();
        }

        function updateStats() {
            document.getElementById('statTotal').textContent = tasks.length;
            document.getElementById('statActive').textContent = tasks.filter(t => !t.completed).length;
            document.getElementById('statDone').textContent = tasks.filter(t => t.completed).length;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatDate(iso) {
            const date = new Date(iso);
            return date.toLocaleDateString('en-PH', { month: 'short', day: 'numeric' });
        }

        // Enter key support
        document.getElementById('taskInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addTask();
        });

        // Initial render
        renderTasks();
    </script>
</body>
</html>
